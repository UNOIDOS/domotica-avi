<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2f5d50">
  <title>Domótica de Avi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <div class="barra__titulo">
      <svg class="barra__logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
      <h1>Domótica de Avi</h1>
    </div>
    <button class="barra__estado" id="estado" type="button" title="Volver a cargar"></button>
  </header>

  <nav class="pestanas" id="pestanas" aria-label="Secciones">
    <a href="#plano" data-vista="plano"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg><span>Plano</span></a>
    <a href="#dispositivos" data-vista="dispositivos"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Dispositivos</span></a>
    <a href="#escenas" data-vista="escenas"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg><span>Escenas</span></a>
    <a href="#pendientes" data-vista="pendientes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span>Pendientes</span><b class="pestanas__num" id="num-pendientes"></b></a>
  </nav>

  <main id="vista" class="vista" tabindex="-1"></main>

  <div class="panel" id="panel" hidden>
    <div class="panel__fondo" data-accion="cerrar"></div>
    <section class="panel__caja" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
      <div class="panel__contenido" id="panel-contenido"></div>
    </section>
  </div>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="plano.js"></script>
  <script src="app.js"></script>
</body>
</html>
